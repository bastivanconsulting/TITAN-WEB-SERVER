apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: titan-web-server
  template:
    metadata:
      labels:
        app: titan-web-server
    spec:
      containers:
      - name: titan-web-server
        image: titan-web-server:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /app/titan-server.conf
          subPath: titan-server.conf
      volumes:
      - name: config-volume
        configMap:
          name: titan-config
