http_port :8080;
https_port :8443;
admin_api_key "change-this-secret-key";
admin_user "admin";
admin_pass "change-this-password";
admin_allowlist 127.0.0.1 ::1;
log_dir "/var/log/titan/";
conf_dir "conf.d/";
security {
    fips_compliant on;
}

http {
    server {
        server_name www.example.com;
        ssl {
            enabled on;
            email "webmaster@example.com";
            provider letsencrypt;
            ocsp_stapling on;
            hsts {
                max_age 31536000;
                include_subdomains on;
                preload on;
            }
        }
        location / {
            root "/var/www/example.com/public";
        }
    }
    server {
        server_name app.internal.local;
        ssl {
            enabled on;
            cert_file "/etc/ssl/certs/app.crt";
            key_file "/etc/ssl/private/app.key";
            provider manual;
        }
        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
    server {
        server_name legacy.local;
        location / {
            root "/var/www/legacy/public";
            fastcgi_pass 127.0.0.1:9000;
        }
    }
    server {
        server_name localhost;
        location /google {
            proxy_pass http://google.com;
        }
        location / {
            root "./test_static";
        }
    }

    #
    # Example PHP Site Configuration
    #
    # server {
    #     server_name my-php-app.local;
    #
    #     # PHP configuration requires a location block with type "php",
    #     # a file_root to the public directory, and a proxy_target
    #     # pointing to the PHP-FPM process (TCP or Unix socket).
    #     location / {
    #         type php;
    #         file_root "/var/www/my-php-app/public";
    #         proxy_target "127.0.0.1:9000"; # Or "unix:/var/run/php/php8.1-fpm.sock"
    #     }
    # }
}
