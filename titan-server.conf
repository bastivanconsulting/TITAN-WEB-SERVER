# Titan Web Server - Exemple de Configuration
# https://github.com/bastivanconsulting/WebServer

# ================================= Global ================================= #

# Port d'écoute HTTP. Commentez pour désactiver.
http_port :8080;

# Port d'écoute HTTPS. Commentez pour désactiver.
https_port :8443;

# Chemin vers la base de données GeoIP pour le blocage par pays du WAF.
# geoip_db_path "/path/to/GeoLite2-Country.mmdb";

# Répertoire des logs.
log_dir "/var/log/titan/";

# ================================= Cache ================================== #

# Configuration du cache. Peut être 'memory' ou 'disk'.
cache {
    type memory;
    # path "/var/cache/titan/"; # Requis si le type est 'disk'
}

# ============================ Let's Encrypt (ACME) ========================== #

# acme {
#     enabled on;
#     email "contact@example.com";
# }

# ================================= HTTP =================================== #

http {
    # ------------------------- Serveur Statique ------------------------- #
    server {
        server_name site-statique.local;
        gzip on;

        # Activer SSL (recommandé)
        # ssl_certificate /chemin/vers/cert.pem;
        # ssl_certificate_key /chemin/vers/cle.pem;

        # Protection WAF de base
        waf {
            enabled on;
            rate_limit 100; # 100 requêtes/min par IP
        }

        location / {
            root "/var/www/site-statique";
        }
    }

    # ------------------------- Proxy Inverse -------------------------- #
    server {
        server_name api.local;
        gzip on;

        location / {
            proxy_pass http://127.0.0.1:3000;

            # Désactiver la vérification SSL pour les backends auto-signés
            # proxy_ssl_verify off;

            # Sécuriser avec une authentification Basic
            # auth_basic "Zone Protégée";
            # auth_basic_user_file /etc/titan/users.htpasswd;

            # Limiter la vitesse de téléchargement à 100 Ko/s
            # limit_rate 100k;
        }
    }

    # ----------------------------- WordPress ---------------------------- #
    server {
        server_name wordpress.local;
        gzip on;

        # Protection WAF renforcée pour WordPress
        waf {
            enabled on;
            waf_wp on;
            waf_php on;
            rate_limit 200;
        }

        location / {
            root "/var/www/wordpress";
            fastcgi_pass 127.0.0.1:9000;

            # Utiliser .htaccess pour les permaliens
            # htaccess on;
        }
    }
}
