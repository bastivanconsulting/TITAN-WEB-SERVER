http_port :80;
https_port :443;
max_threads 0;
admin_api_key "change-this-secret-key";
admin_user "admin";
admin_pass "change-this-password";
admin_allowlist 0.0.0.0;
log_dir "/var/log/titan/";
conf_dir "conf.d/";
security {
    fips_compliant on;
}

http {
    server {
        server_name test.local;

        waf {
            enabled on;
            # Bloque les attaques par injection SQL
            check_sqli on;
            # Bloque les attaques Cross-Site Scripting (XSS)
            check_xss on;
            # Bloque les attaques Local File Inclusion (LFI)
            check_lfi on;
            # Bloque les User-Agents malveillants connus
            check_ua on;

            # Limite le nombre de requêtes par minute par IP
            rate_limit 100;

            # Liste blanche d'IPs (ne seront jamais bloquées par le WAF)
            allow_list 127.0.0.1 ::1;

            # Liste noire d'IPs (seront toujours bloquées)
            deny_list;

            # Bloque les pays par leur code ISO (e.g., US, CN, RU)
            deny_countries;
        }

        location / {
            proxy_pass http://localhost;
        }

        # Appliquer des règles WAF plus strictes pour la section /admin
        location /admin {
            proxy_pass http://localhost/admin;
            waf {
                # Limite de taux plus agressive
                rate_limit 10;

                # Activer le challenge JavaScript pour une protection supplémentaire
                js_challenge {
                    enabled on;
                }
            }
        }
    }
    server {
        server_name bc-vm-82-21-0-53-eu-west-par.bastivan.cloud;
        location / {
            root "/var/www/titan/public/";
            fastcgi_pass 127.0.0.1:9000;
        }
    }
    server {
        server_name www.bastivan.consulting;
        location / {
            proxy_pass https://www.bastivan.consulting/;
        }
    }
}
