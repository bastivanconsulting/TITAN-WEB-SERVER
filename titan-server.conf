http_port :80;
https_port :443;
max_threads 0;
admin_api_key "change-this-secret-key";
admin_user "admin";
admin_pass "change-this-password";
admin_allowlist 0.0.0.0;
log_dir "/var/log/titan/";
conf_dir "conf.d/";
security {
    fips_compliant on;
}

http {
    server {
        server_name test.local;
        location / {
            proxy_pass http://localhost;
        }
    }
    server {
        server_name bc-vm-82-21-0-53-eu-west-par.bastivan.cloud;
        location / {
            root "/var/www/titan/public/";
            fastcgi_pass 127.0.0.1:9000;
        }
    }
    server {
        server_name www.bastivan.consulting;
        location / {
            proxy_pass https://www.bastivan.consulting/;
        }
    }
}
