
user titan;
worker_processes auto;

http_port :8080;
https_port :8443;

admin_api_key "change-this-secret-key";
admin_user "admin";
admin_pass "change-this-password";
admin_allowlist 127.0.0.1 ::1;

log_dir "/var/log/titan/";
conf_dir "conf.d/";

security {
    fips_compliant on;
}

http {
    server {
        server_name www.example.com;

        ssl {
            enabled on;
            email "webmaster@example.com";
            provider letsencrypt;
            ocsp_stapling on;

            hsts {
                max_age 31536000;
                include_subdomains on;
                preload on;
            }
        }

        location / {
            root /var/www/example.com/public;
        }
    }

    server {
        server_name app.internal.local;

        ssl {
            enabled on;
            cert_file /etc/ssl/certs/app.crt;
            key_file /etc/ssl/private/app.key;
            provider manual;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }

    server {
        server_name legacy.local;

        location / {
            root /var/www/legacy/public;
            fastcgi_pass 127.0.0.1:9000;
        }
    }

    server {
        server_name localhost;

        location /google {
            proxy_pass http://google.com;
        }

        location / {
            root ./test_static;
        }
    }
}
