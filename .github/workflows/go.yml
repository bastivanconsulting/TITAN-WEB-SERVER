# .github/workflows/go.yml

name: Go CI (Test, Build & Release)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' 
  pull_request:
    branches: [ "main" ]

jobs:

  # JOB 1: Test et Build du binaire
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.24.3
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Download Go dependencies (go mod download)
      run: go mod download

    - name: Run Tests 🧪
      run: go test -v ./...

    - name: Build executable (titan-web-server)
      run: go build -v -o titan-web-server ./cmd/server/main.go
      
    - name: Get Version/Tag (for packaging)
      id: get_version
      run: |
        TAG_NAME=$(git describe --tags --always)
        echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: titan-web-server

# ----------------------------------------------------------------------------------

  # JOB 2: Creation des paquets DEB et RPM
  package:
    runs-on: ubuntu-latest
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: .

    - name: Create packaging scripts
      run: |
        mkdir -p scripts
        
        # Fichier de service Systemd (Syntaxe cat plus fiable)
        cat > scripts/titan-server.service << 'EOT'
[Unit]
Description=Titan Web Server
Documentation=https://github.com/bastivanconsulting/WebServer
After=network.target

[Service]
Type=simple
User=titan
Group=titan
ExecStart=/usr/bin/titan-web-server -config /etc/titan-server/titan-server.conf -node-id %H -raft-addr 0.0.0.0:9000 -raft-dir /var/lib/titan-server
Restart=always
LimitNOFILE=65535

[Install]
WantedBy=multi-user.target
EOT

        # Script de post-installation
        cat > scripts/postinst.sh << 'EOT'
#!/bin/bash
if ! getent group titan > /dev/null; then
    groupadd -r titan
fi
if ! getent passwd titan > /dev/null; then
    useradd -r -g titan -d /var/lib/titan-server -s /sbin/nologin -c "Titan Web Server" titan
fi

mkdir -p /var/log/titan /var/lib/titan-server
chown -R titan:titan /var/log/titan || :
chown -R titan:titan /var/lib/titan-server || :

systemctl daemon-reload
systemctl enable titan-server.service
EOT
        
        # Script de pré-suppression
        cat > scripts/prerm.sh << 'EOT'
#!/bin/bash
if [ "$1" = "remove" ]; then
    systemctl stop titan-server.service || :
    systemctl disable titan-server.service || :
    systemctl daemon-reload
fi
EOT

    - name: Create nfpm configuration
      run: |
        TAG_NAME=$(echo ${{ needs.build.outputs.tag_name }} | sed 's/^v//')
        if [ "$TAG_NAME" == "" ]; then TAG_NAME="0.1.0-dev"; fi
        
        # Crée nfpm.yaml
        cat << EOF > nfpm.yaml
name: "titan-web-server"
arch: "amd64"
platform: "linux"
version: "$TAG_NAME"
section: "web"
priority: "extra"
maintainer: "Bastivan Consulting <contact@bastivanconsulting.com>"
description: "Serveur Web et reverse proxy haute performance Titan."
license: "Proprietary/TBD"
contents:
  - src: ./titan-web-server
    dst: /usr/bin/titan-web-server
    file_info:
      mode: 0755
      user: root
      group: root
  - src: ./titan-server.conf 
    dst: /etc/titan-server/titan-server.conf
    file_info:
      mode: 0644
      user: titan
      group: titan
      config: true 
  - src: ./scripts/titan-server.service
    dst: /etc/systemd/system/titan-server.service
    file_info:
      mode: 0644
      user: root
      group: root
  - dst: /var/log/titan
    type: dir 
    file_info:
      mode: 0755
      user: titan
      group: titan
  - dst: /var/lib/titan-server
    type: dir
    file_info:
      mode: 0755
      user: titan
      group: titan
scripts:
  postinstall: ./scripts/postinst.sh
  preremove: ./scripts/prerm.sh
EOF

    - name: Build Debian and RPM packages 📦
      uses: goreleaser/nfpm-action@v3
      with:
        nfpm_file: nfpm.yaml
        targets: "deb,rpm"
        
    - name: Upload Packages Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-web-server-packages
        path: packages/

# ----------------------------------------------------------------------------------

  # JOB 3: Création de la Release GitHub
  release:
    runs-on: ubuntu-latest
    needs: package
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
      
    - name: Download Packages Artifact
      uses: actions/download-artifact@v4
      with:
        name: titan-web-server-packages
        path: packages/
        
    - name: Create GitHub Release and Upload Assets 🚀
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Automatic release of Titan Web Server packages.
          
          Assets include:
          - .deb package for Debian/Ubuntu
          - .rpm package for Red Hat/CentOS
        files: |
          packages/*
