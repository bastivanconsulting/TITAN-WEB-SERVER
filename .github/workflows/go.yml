# .github/workflows/go.yml

name: Go CI (Test, Build & Auto-Release)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ⚠️ INDISPENSABLE : Permet au workflow de créer des Releases et des Tags
permissions:
  contents: write

jobs:

  # JOB 1: Test et Build
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.24.3
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Download Go dependencies
      run: go mod download

    - name: Run Tests 🧪
      run: go test -v ./...

    - name: Build executable
      run: go build -v -o titan-web-server ./cmd/server/main.go
      
    - name: Generate Auto Version
      id: get_version
      run: |
        # Génération automatique : v0.1.{Numéro de Build GitHub}
        # Exemple : v0.1.42
        AUTO_TAG="v0.1.${{ github.run_number }}"
        echo "Version générée : $AUTO_TAG"
        echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: titan-web-server

# ----------------------------------------------------------------------------------

  # JOB 2: Packaging (DEB/RPM)
  package:
    runs-on: ubuntu-latest
    needs: build
    # On exécute sur la branche main (plus besoin d'attendre un tag manuel)
    if: success() && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: .

    - name: Create packaging scripts
      run: |
        mkdir -p scripts
        
        cat <<EOF > scripts/titan-server.service
        [Unit]
        Description=Titan Web Server
        Documentation=https://github.com/bastivanconsulting/WebServer
        After=network.target

        [Service]
        Type=simple
        User=titan
        Group=titan
        ExecStart=/usr/bin/titan-web-server -config /etc/titan-server/titan-server.conf -node-id %H -raft-addr 0.0.0.0:9000 -raft-dir /var/lib/titan-server
        Restart=always
        LimitNOFILE=65535

        [Install]
        WantedBy=multi-user.target
        EOF

        cat <<EOF > scripts/postinst.sh
        #!/bin/bash
        if ! getent group titan > /dev/null; then
            groupadd -r titan
        fi
        if ! getent passwd titan > /dev/null; then
            useradd -r -g titan -d /var/lib/titan-server -s /sbin/nologin -c "Titan Web Server" titan
        fi
        mkdir -p /var/log/titan /var/lib/titan-server
        chown -R titan:titan /var/log/titan || :
        chown -R titan:titan /var/lib/titan-server || :
        systemctl daemon-reload
        systemctl enable titan-server.service
        EOF

        cat <<EOF > scripts/prerm.sh
        #!/bin/bash
        if [ "\$1" = "remove" ]; then
            systemctl stop titan-server.service || :
            systemctl disable titan-server.service || :
            systemctl daemon-reload
        fi
        EOF

    - name: Create nfpm configuration
      run: |
        # On récupère la version générée automatiquement
        TAG_NAME=$(echo ${{ needs.build.outputs.tag_name }} | sed 's/^v//')
        
        cat <<EOF > nfpm.yaml
        name: "titan-web-server"
        arch: "amd64"
        platform: "linux"
        version: "$TAG_NAME"
        section: "web"
        priority: "extra"
        maintainer: "Bastivan Consulting <contact@bastivanconsulting.com>"
        description: "Titan Web Server"
        license: "Proprietary"
        contents:
          - src: ./titan-web-server
            dst: /usr/bin/titan-web-server
            file_info:
              mode: 0755
          - src: ./titan-server.conf 
            dst: /etc/titan-server/titan-server.conf
            file_info:
              mode: 0644
              config: true 
          - src: ./scripts/titan-server.service
            dst: /etc/systemd/system/titan-server.service
            file_info:
              mode: 0644
          - dst: /var/log/titan
            type: dir 
            file_info:
              mode: 0755
              user: titan
              group: titan
          - dst: /var/lib/titan-server
            type: dir
            file_info:
              mode: 0755
              user: titan
              group: titan
        scripts:
          postinstall: ./scripts/postinst.sh
          preremove: ./scripts/prerm.sh
        EOF

    - name: Build Packages 📦
      uses: goreleaser/nfpm-action@v3
      with:
        nfpm_file: nfpm.yaml
        targets: "deb,rpm"
        
    - name: Upload Packages Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-web-server-packages
        path: packages/

# ----------------------------------------------------------------------------------

  # JOB 3: Release Automatique
  release:
    runs-on: ubuntu-latest
    needs: [build, package]
    if: success() && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      
    - name: Download Packages
      uses: actions/download-artifact@v4
      with:
        name: titan-web-server-packages
        path: packages/
        
    - name: Create Release & Tag 🚀
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # C'est ici que la magie opère : 
        # On force le nom du tag avec la version générée (ex: v0.1.42).
        # L'action va CRÉER ce tag automatiquement s'il n'existe pas.
        tag_name: ${{ needs.build.outputs.tag_name }}
        name: Release ${{ needs.build.outputs.tag_name }}
        body: "Automatic release of Titan Web Server packages (.deb, .rpm)."
        files: packages/*
