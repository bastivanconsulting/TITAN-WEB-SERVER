# .github/workflows/go.yml

name: Go CI (Test, Build & Auto-Release)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ⚠️ PERMISSIONS CRITIQUES pour la Release
permissions:
  contents: write

jobs:

  # JOB 1: Test et Build
  build:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go 1.24.3
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Download Go dependencies
      run: go mod download

    - name: Run Tests 🧪
      run: go test -v ./...

    - name: Build executable
      run: go build -v -o titan-web-server ./cmd/server/main.go
      
    - name: Generate Auto Version
      id: get_version
      run: |
        # Génère une version unique basée sur le numéro de build GitHub
        # Ex: v0.1.42
        AUTO_TAG="v0.1.${{ github.run_number }}"
        echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
        echo "Generated version: $AUTO_TAG"
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: titan-web-server

# ----------------------------------------------------------------------------------

  # JOB 2: Packaging (DEB/RPM)
  package:
    runs-on: ubuntu-latest
    needs: build
    # Exécuter uniquement sur la branche main
    if: success() && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    # Configuration de Go pour installer nFPM
    - name: Set up Go 1.24.3
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'
    
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: titan-web-server-linux-amd64
        path: .

    - name: Create packaging scripts
      run: |
        mkdir -p scripts
        
        # Service Systemd
        cat <<EOF > scripts/titan-server.service
        [Unit]
        Description=Titan Web Server
        Documentation=https://github.com/bastivanconsulting/WebServer
        After=network.target

        [Service]
        Type=simple
        User=titan
        Group=titan
        ExecStart=/usr/bin/titan-web-server -config /etc/titan-server/titan-server.conf -node-id %H -raft-addr 0.0.0.0:9000 -raft-dir /var/lib/titan-server
        Restart=always
        LimitNOFILE=65535

        [Install]
        WantedBy=multi-user.target
        EOF

        # Script Post-Installation
        cat <<EOF > scripts/postinst.sh
        #!/bin/bash
        if ! getent group titan > /dev/null; then
            groupadd -r titan
        fi
        if ! getent passwd titan > /dev/null; then
            useradd -r -g titan -d /var/lib/titan-server -s /sbin/nologin -c "Titan Web Server" titan
        fi
        mkdir -p /var/log/titan /var/lib/titan-server
        chown -R titan:titan /var/log/titan || :
        chown -R titan:titan /var/lib/titan-server || :
        systemctl daemon-reload
        systemctl enable titan-server.service
        EOF

        # Script Pré-Suppression
        cat <<EOF > scripts/prerm.sh
        #!/bin/bash
        if [ "\$1" = "remove" ]; then
            systemctl stop titan-server.service || :
            systemctl disable titan-server.service || :
            systemctl daemon-reload
        fi
        EOF

    - name: Create nfpm configuration
      run: |
        # Nettoyer le 'v' pour la version du paquet (Linux préfère 0.1.42 à v0.1.42)
        TAG_NAME=$(echo ${{ needs.build.outputs.tag_name }} | sed 's/^v//')
        
        cat <<EOF > nfpm.yaml
        name: "titan-web-server"
        arch: "amd64"
        platform: "linux"
        version: "$TAG_NAME"
        section: "web"
        priority: "extra"
        maintainer: "Bastivan Consulting <contact@bastivanconsulting.com>"
        description: "Titan Web Server"
        license: "Proprietary"
        contents:
          - src: ./titan-web-server
            dst: /usr/bin/titan-web-server
            file_info:
              mode: 0755
          - src: ./titan-server.conf 
            dst: /etc/titan-server/titan-server.conf
            type: config
            file_info:
              mode: 0644
          - src: ./scripts/titan-server.service
            dst: /etc/systemd/system/titan-server.service
            file_info:
              mode: 0644
          - dst: /var/log/titan
            type: dir 
            file_info:
              mode: 0755
              owner: titan
              group: titan
          - dst: /var/lib/titan-server
            type: dir
            file_info:
              mode: 0755
              owner: titan
              group: titan
        scripts:
          postinstall: ./scripts/postinst.sh
          preremove: ./scripts/prerm.sh
        EOF

    - name: Install and Run nFPM 📦
      run: |
        # Installation de nFPM via Go
        go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
        
        mkdir -p packages
        
        echo "Building DEB..."
        nfpm package --config nfpm.yaml --pack
