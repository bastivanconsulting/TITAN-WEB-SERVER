# .github/workflows/go.yml

name: Go CI (Test, Build & Release)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:

  # -----------------------------
  # JOB 1: Test et Build
  # -----------------------------
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Download Go dependencies
        run: go mod download

      - name: Run Tests 🧪
        run: go test -v ./...

      - name: Build executable
        run: |
          go build -v -o titan-web-server${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/server/main.go

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME="v0.1.${{ github.run_number }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Version utilisée : $TAG_NAME"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-web-server-${{ matrix.os }}-amd64
          path: titan-web-server${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  # -----------------------------
  # JOB 2: Packaging (DEB/RPM)
  # -----------------------------
  package:
    runs-on: ubuntu-latest
    needs: build
    # Run on tags OR on main branch so we can test the package generation
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: titan-web-server-ubuntu-latest-amd64
          path: .

      - name: Install nFPM via Go and add to PATH
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Create nfpm configuration
        run: |
          TAG_NAME=$(echo ${{ needs.build.outputs.tag_name }} | sed 's/^v//')
          cat > nfpm.yaml << EOF
          name: "titan-web-server"
          arch: "amd64"
          platform: "linux"
          version: "$TAG_NAME"
          section: "web"
          priority: "extra"
          maintainer: "Bastivan Consulting <contact@bastivanconsulting.com>"
          description: "Titan Web Server"
          license: "Proprietary"
          contents:
            - src: ./titan-web-server
              dst: /usr/bin/titan-web-server
              file_info:
                mode: 0755
            - src: ./titan-server.conf
              dst: /etc/titan/titan-server.conf
              type: config
              file_info:
                mode: 0644
            - src: ./packaging/systemd/titan-web-server.service
              dst: /etc/systemd/system/titan-web-server.service
              file_info:
                mode: 0644
            - src: ./VERSION
              dst: /usr/share/titan-web-server/VERSION
              file_info:
                mode: 0644
            - dst: /var/log/titan
              type: dir
              file_info:
                mode: 0755
                owner: titan
                group: titan
            - dst: /var/lib/titan-server
              type: dir
              file_info:
                mode: 0755
                owner: titan
                group: titan
          scripts:
            postinstall: ./packaging/scripts/postinst.sh
            preremove: ./packaging/scripts/prerm.sh
          EOF

      - name: Build DEB & RPM packages
        run: |
          mkdir -p packages
          nfpm package --config nfpm.yaml --packager deb --target packages/
          nfpm package --config nfpm.yaml --packager rpm --target packages/
          ls -l packages/

      - name: Upload Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: titan-web-server-packages
          path: packages/

  # -----------------------------
  # JOB 3: Docker Build & Push
  # -----------------------------
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test the Docker image
        run: |
          IMAGE_ID=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testing image: $IMAGE_ID"
          docker run --rm $IMAGE_ID --version

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} docker push {}

  # -----------------------------
  # JOB 4: Release (UNIQUEMENT sur tag)
  # -----------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, package, docker]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: titan-web-server-packages
          path: packages/

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: titan-web-server-windows-latest-amd64
          path: packages/

      - name: Generate Release Body
        id: generate_release_body
        run: |
          TAG_NAME="${{ needs.build.outputs.tag_name }}"
          DOCKER_TAG=${TAG_NAME#v}
          RELEASE_BODY=$(cat <<EOF
          🚀 Release of Titan Web Server.

          **Version**: $TAG_NAME
          **Commit**: ${{ github.sha }}

          📦 **Artifacts included:**
          - .deb (Debian/Ubuntu)
          - .rpm (RHEL/CentOS)
          - Windows executable

          🐳 **Docker Image:**
          L'image Docker est disponible sur GitHub Container Registry:
          \`ghcr.io/${{ github.repository }}:$DOCKER_TAG\`
          EOF
          )
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release & Tag 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.tag_name }}
          body: ${{ steps.generate_release_body.outputs.body }}
          files: packages/*
