<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error {{.Code}} ({{.Title}})</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #555; background: #fff; font-size: 16px; margin: 7% auto 0; max-width: 390px; min-height: 180px; padding: 30px 0 15px; }
        p { margin: 11px 0 22px; overflow: hidden; }
        ins { color: #777; text-decoration: none; }
        a img { border: 0; }
        @media screen and (max-width: 772px) {
            body { background: none; margin-top: 0; max-width: none; padding-right: 0; }
        }
        #logo { background: url('//www.google.com/images/branding/googlelogo/1x/googlelogo_color_150x54dp.png') no-repeat; margin-left: -5px; }
        @media only screen and (min-resolution: 192dpi) {
            #logo { background: url('//www.google.com/images/branding/googlelogo/2x/googlelogo_color_150x54dp.png') no-repeat 0% 0%/100% 100%; -moz-border-image: url('//www.google.com/images/branding/googlelogo/2x/googlelogo_color_150x54dp.png') 0; }
        }
        @media only screen and (-webkit-min-device-pixel-ratio: 2) {
            #logo { background: url('//www.google.com/images/branding/googlelogo/2x/googlelogo_color_150x54dp.png') no-repeat; -webkit-background-size: 100% 100%; }
        }
        #logo { display: inline-block; height: 54px; width: 150px; }
        .error-code { font-size: 30px; font-weight: bold; margin-bottom: 10px; }
        .error-message { color: #222; }
        .tech-info { font-size: 12px; color: #999; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div id="content">
        <a href="/">
            <!-- Placeholder for logo, using text "Titan" styled similarly if no image -->
            <span style="font-size: 24px; font-weight: bold; color: #4285F4; text-decoration: none;">Titan</span>
            <span style="font-size: 24px; font-weight: bold; color: #EA4335;">Web</span>
            <span style="font-size: 24px; font-weight: bold; color: #FBBC05;">Server</span>
        </a>
        <p class="error-code">{{.Code}}. <span style="color: #777; font-weight: normal;">That’s an error.</span></p>
        <div class="error-message">
            <p>The requested URL was not found on this server. <ins>That’s all we know.</ins></p>
            <p><strong>{{.Title}}</strong>: {{.Message}}</p>
        </div>

        <div class="tech-info">
            Request ID: {{.RayID}}<br>
            Client IP: {{.ClientIP}}
        </div>
    </div>
    <div style="margin-top: 50px; text-align: center;">
        <!-- Simple robot graphic placeholder -->
        <svg width="100" height="100" viewBox="0 0 24 24" fill="#ccc">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
    </div>
</body>
</html>
