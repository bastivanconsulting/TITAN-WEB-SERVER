<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur {{.Code}}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        h1 { font-size: 72px; margin: 0; color: #e74c3c; }
        h2 { margin: 10px 0 20px; color: #333; }
        p { color: #666; line-height: 1.5; }
        .footer { margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{.Code}}</h1>
        <h2>{{.Title}}</h2>
        <p>{{.Message}}</p>
        <div class="footer">
            Ray ID: {{.RayID}} &bull; IP: {{.ClientIP}}
        </div>
    </div>
</body>
</html>
